<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:;">
  <title>Wallet Budget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="gate" hidden>
    <form class="gate-card" id="gate-form">
      <h1>Wallet Budget</h1>
      <p id="gate-msg">Paste your Wallet API token to begin.</p>
      <label for="token">API token</label>
      <input id="token" type="password" placeholder="wlt_…" autocomplete="off" spellcheck="false">
      <button id="save" type="submit">Connect</button>
      <p id="gate-err" class="err" role="alert"></p>
      <p class="hint">Wallet web, Settings &rarr; API. Requires Premium.</p>
    </form>
  </section>

  <main id="dash" hidden>
    <header>
      <h1>Wallet Budget</h1>
      <span id="stamp"></span>
      <button id="refresh">Refresh</button>
    </header>

    <section class="runway" aria-labelledby="runway-h">
      <h2 id="runway-h" class="sr-only">Balance runway</h2>
      <div id="runway"></div>
      <p id="verdict"></p>
      <p id="next" class="next"></p>
    </section>

    <div class="grid">
      <section class="panel budgets">
        <h2>Budgets <span id="period"></span></h2>
        <div id="budgets"></div>
      </section>

      <div class="side">
        <section class="panel">
          <h2>Due next 30 days</h2>
          <div id="upcoming"></div>
        </section>
        <section class="panel">
          <h2>Needs review <span id="inbox-n"></span></h2>
          <div id="inbox"></div>
          <div id="sync"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
