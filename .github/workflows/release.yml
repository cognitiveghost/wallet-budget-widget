name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # electron-builder names the exe from package.json's `version`, but the
      # tag is what actually cuts a release and nobody remembers to bump both.
      # Every artifact since v0.1.0 therefore carried whatever version the file
      # happened to hold. The tag wins; package.json is only the dev default.
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: npm version $env:GITHUB_REF_NAME --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm run build
      # The rename above is silent when it fails, and the failure looks exactly
      # like a successful release until somebody downloads it.
      - name: The artifact must carry the tag's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^v', ''
          $want = "dist/WalletBudgetWidget-$v.exe"
          if (-not (Test-Path $want)) {
            throw "expected $want, built: $((Get-ChildItem dist/*.exe).Name -join ', ')"
          }
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # Cutting the release in the GitHub UI is what creates the tag that
        # triggers this run, so the release already exists by the time we get
        # here and `create` collides. Upload into whichever release the tag has
        # and only create one when there is none — which also makes a re-run of
        # a failed build safe. `release list` is the existence check because it
        # exits 0 either way; `release view` exits 1 and pwsh 7.4 turns a failed
        # native command into a terminating error.
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ((gh release list --json tagName --jq '.[].tagName') -notcontains $tag) {
            gh release create $tag --generate-notes
          }
          gh release upload $tag (Get-Item dist/*.exe) --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: WalletBudgetWidget
          path: dist/*.exe
